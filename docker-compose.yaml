services:
  db:
    image: postgres:17
    restart: no
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: default
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 5436:5432
 
  adminer:
    image: adminer
    restart: no
    ports:
      - 8080:8080
 
volumes:
  pgdata:
